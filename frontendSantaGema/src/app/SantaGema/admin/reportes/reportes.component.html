<div class="col-12">
    <div class="card p-4">
        <div class="card-header">
            <h5>Generar Reporte</h5>
        </div>
        <form [formGroup]="form" class="p-fluid p-formgrid grid align-items-center">
            <div class="field col-12 md:col-5">
                <label for="anioLectivo">Año lectivo</label>
                <p-autoComplete id="anioLectivo" formControlName="anio" [suggestions]="filteredAnioLectivos$ | async"
                    field="nombre" [dropdown]="true" (completeMethod)="onSearch('anio', $event.query)">
                </p-autoComplete>
            </div>
            <div class="field col-12 md:col-5">
                <label for="curso">Curso</label>
                <p-autoComplete id="curso" formControlName="curso" [suggestions]="filteredCursos$ | async"
                    field="nombre" [dropdown]="true" [disabled]="!form.value.anio"
                    (completeMethod)="onSearch('curso', $event.query)">
                </p-autoComplete>
            </div>
            <div class="field col-12 md:col-2 mt-4">
                <button pButton type="button" label="Filtrar" [disabled]="form.invalid" (click)="cargarEstudiantes()">
                </button>
            </div>
        </form>
        <p-table #dt [value]="dataTableEstudiantes" [columns]="cols" responsiveLayout="scroll" [rows]="rowsInit"
            [paginator]="true" [globalFilterFields]="globalFilterFields" [rowsPerPageOptions]="rowsPerPageOptions"
            [showCurrentPageReport]="true"
            currentPageReportTemplate="Mostrando del {first} al {last} de {totalRecords} registros" [rowHover]="true"
            dataKey="id">

            <!-- Caption -->
            <ng-template pTemplate="caption">
                <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
                    <span class="block mt-2 md:mt-0 p-input-icon-left">
                        <i class="pi pi-search"></i>
                        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Buscar..."
                            class="w-full sm:w-auto" />
                    </span>
                </div>
            </ng-template>

            <!-- Header -->
            <ng-template pTemplate="header">
                <tr>
                    <th *ngFor="let item of cols" class="text-center" [hidden]="item.type === 'hidden'"
                        [pSortableColumn]="item.field" [ngStyle]="{'max-width': item.maxWidth || 'auto'}">
                        {{item.header}}
                        <p-sortIcon [field]="item.field"></p-sortIcon>
                    </th>
                    <th class="text-center">
                        Opciones
                    </th>
                </tr>
            </ng-template>

            <!-- Body -->
            <ng-template pTemplate="body" let-matricula>
                <tr>
                    <td *ngFor="let col of cols" style="text-align: center;">
                        <!-- Text Type -->
                        <span *ngIf="col.type === 'text'">{{ matricula | transformarDatos: col.field
                            }}</span>
                    </td>

                    <!-- Opciones -->
                    <td>
                        <div class="flex justify-content-center">
                            <button *ngIf="!editing" pButton pRipple icon="pi pi-id-card"
                                class="p-button-rounded p-button-secondary mr-2" (click)="generarCertifiado(matricula, 'matricula')"
                                pTooltip="Certificado de matrícula" tooltipPosition="top">
                            </button>
                            <button *ngIf="!editing" pButton pRipple icon="pi pi-file-pdf"
                                class="p-button-rounded p-button-secondary mr-2" (click)="generarCertifiado(matricula, 'notas')"
                                pTooltip="Certificado de notas" tooltipPosition="top">
                            </button>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<p-toast></p-toast>
<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="medium" color="#08b549" type="ball-fussion" [fullScreen]="true">
    <p style="color: #08b549">Cargando...</p>
</ngx-spinner>
